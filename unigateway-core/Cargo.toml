[package]
name = "unigateway-core"
version = "2.11.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
description = "Core in-memory LLM proxy and scheduling engine for UniGateway"
repository = "https://github.com/EeroEternal/unigateway"

[features]
default = ["engine", "sglang-lite"]
# Documentation marker; conversion types (request builders, parsing, endpoint context) are always available.
conversion = []
# ProviderDriver / DriverRegistry and HTTP driver implementations.
drivers = []
# Full in-process engine: routing, retries, hooks, registry, feedback.
engine = ["drivers", "dep:rand"]
sglang-lite = ["drivers"]
sglang-lite-grpc = ["sglang-lite", "dep:tonic", "dep:prost", "dep:tonic-build", "dep:tonic-health"]

[dependencies]
futures-core = "0.3"
futures-util.workspace = true
# Kept always-on for now: sglang-lite and transport share reqwest; making it optional is deferred.
reqwest = { workspace = true, features = ["stream"] }
rand = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror = "1"
tokio = { workspace = true, features = ["sync", "process"] }
tokio-stream = "0.1"
tonic = { workspace = true, optional = true, features = ["transport"] }
prost = { workspace = true, optional = true }
tonic-health = { workspace = true, optional = true }

[build-dependencies]
tonic-build = { workspace = true, optional = true }

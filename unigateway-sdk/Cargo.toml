[package]
name = "unigateway-sdk"
version = "2.15.0"
edition = "2024"
rust-version = "1.92"
description = "Thin facade crate for embedders using UniGateway core, protocol, and host libraries."
license = "MIT"
repository = "https://github.com/EeroEternal/unigateway"
readme = "README.md"
keywords = ["llm", "gateway", "sdk", "openai", "anthropic"]
categories = ["api-bindings"]

[features]
default = ["host", "sglang-lite"]
embed = ["host"]
config = ["dep:unigateway-config"]
core = ["dep:unigateway-core", "unigateway-core/engine"]
protocol = ["core", "dep:unigateway-protocol"]
host = ["protocol", "dep:unigateway-host"]
session = ["host", "dep:unigateway-session"]
sglang-lite = ["core", "unigateway-core/sglang-lite"]
sglang-lite-grpc = ["sglang-lite", "unigateway-core/sglang-lite-grpc"]
# Conversion-only surface: request builders / parsers / render helpers without UniGatewayEngine.
conversion = ["dep:unigateway-core", "dep:unigateway-protocol"]
testing = ["host", "unigateway-host/testing"]

[dependencies]
unigateway-config = { workspace = true, optional = true }
unigateway-core = { workspace = true, optional = true }
unigateway-protocol = { workspace = true, optional = true }
unigateway-host = { workspace = true, optional = true }
unigateway-session = { workspace = true, optional = true }

[dev-dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { workspace = true }
futures-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3" }

[[example]]
name = "openai_passthrough"
required-features = ["host"]

[[example]]
name = "anthropic_tools_probe"
required-features = ["host"]

[[example]]
name = "sglang_lite_local"
required-features = ["sglang-lite", "protocol"]

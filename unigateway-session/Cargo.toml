[package]
name = "unigateway-session"
version = "2.12.0"
edition = "2024"
rust-version = "1.92"
description = "Optional in-memory session prefix store and delta assembly middleware for UniGateway embedders."
license = "MIT"
repository = "https://github.com/EeroEternal/unigateway"
readme = "README.md"

[features]
default = []
http = ["dep:axum"]

[dependencies]
anyhow.workspace = true
serde = { workspace = true }
serde_json.workspace = true
tokio = { workspace = true, features = ["sync"] }
unigateway-core = { workspace = true, features = ["engine"] }
unigateway-host.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[dependencies.axum]
version = "0.7"
optional = true
features = ["json"]

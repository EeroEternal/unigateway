[package]
name = "unigateway-session-redis"
version = "2.15.0"
edition = "2024"
rust-version = "1.92"
description = "Redis-backed SessionStore implementation for UniGateway session prefix storage."
license = "MIT"
repository = "https://github.com/EeroEternal/unigateway"
readme = "README.md"

[dependencies]
redis = { version = "0.27", default-features = false, features = ["script"] }
serde = { workspace = true }
serde_json.workspace = true
unigateway-session.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
